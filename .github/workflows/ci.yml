name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install libvirt-dev
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev

      - name: Run tests
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install libvirt-dev
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev

      - name: Run go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install libvirt-dev
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev

      - name: Build goshipctl
        run: go build -o bin/goshipctl ./cmd/goshipctl

      - name: Build goship-init
        run: CGO_ENABLED=0 go build -o bin/goship-init ./cmd/goship-init
